[workspace]
members = [".", "passman_crypto"]
exclude = [".patched-crates"]
resolver = "2"

[package]
name = "passman_ts_rs"
version = "0.1.0"
edition = "2024"

[features]
tsbindings = ["ts-rs"]
default = ["tsbindings"]

[dependencies]
actix-files = "0.6"
actix-web = "4.12.1"
anyhow = "1.0.100"
awc = "3"
argon2 = "0.5.3"
async-stream = "0.3.6"
dashmap = "6.1.0"
futures-core = "0.3.31"
futures-util = "0.3.31"
im = "15.1.0"
passman_crypto = { path = "passman_crypto" }
rand = "0.9.2"
serde = "1.0.228"
serde_json = "1.0.145"
subtle = "2.6.1"
tokio = { version = "1.48.0", features = ["full"] }
ts-rs = { version = "11.0.0", optional = true }

[dev-dependencies]
sha2 = "0.10"
tempfile = "3"

# tokio with `RwLock::upgrade` (patches/tokio-1.48.0.patch);
# run scripts/patch-crates.sh before building to create this directory
[patch.crates-io]
tokio = { path = ".patched-crates/tokio-1.48.0" }
