[workspace]
members = [".", "passman_crypto"]
exclude = [".patched-crates"]
resolver = "2"

[package]
name = "passman_ts_rs"
version = "0.1.0"
edition = "2024"

[features]
tsbindings = ["ts-rs"]
default = ["tsbindings"]

[dependencies]
actix-files = "0.6"
actix-web = "4.12.1"
anyhow = "1.0.100"
awc = "3"
base64 = "0.23.1"
async-stream = "0.3.6"
futures-util = "0.3.31"
passman_crypto = { path = "passman_crypto" }
percent-encoding = "2.3.2"
serde = "1.0.228"
serde_json = "1.0.145"
sha2 = "0.10"
subtle = "2.6.1"
tokio = { version = "1.48.0", features = ["full"] }
ts-rs = { version = "11.0.0", optional = true }

[dev-dependencies]
tempfile = "3"

# the tests derive account keys (64 MiB Argon2id), far too slow unoptimized
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

# tokio with `RwLock::upgrade` (patches/tokio-1.48.0.patch);
# run scripts/patch-crates.sh before building to create this directory
[patch.crates-io]
tokio = { path = ".patched-crates/tokio-1.48.0" }
